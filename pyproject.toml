[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lux-comext"
version = "0.1.0"
description = "Offline Luxembourg Comext trade ingestion and query application"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "The Outliers" }]
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
    "py7zr>=1.0.0",
    "PyYAML>=6.0.2",
    "requests>=2.32.2",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[project.scripts]
lux-comext = "lux_comext.cli:app"
